stages:
  - build

build-ozon-app-web:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  variables:
    DOCKER_CONFIG: /kaniko/.docker
  before_script:
    - test -n "${REGISTRY_HOST}" || (echo "REGISTRY_HOST is empty - check protected variable/branch settings" && exit 1)
    - test -n "${REGISTRY_USER}" || (echo "REGISTRY_USER is empty - check protected variable/branch settings" && exit 1)
    - test -n "${REGISTRY_PASSWORD}" || (echo "REGISTRY_PASSWORD is empty - check protected variable/branch settings" && exit 1)
    - test -n "${IMAGE_REF}" || (echo "IMAGE_REF is empty - check protected variable/branch settings" && exit 1)
    - mkdir -p "${DOCKER_CONFIG}"
    - echo "{\"auths\":{\"${REGISTRY_HOST}\":{\"auth\":\"$(printf '%s:%s' "${REGISTRY_USER}" "${REGISTRY_PASSWORD}" | base64 | tr -d '\n')\"}}}" > "${DOCKER_CONFIG}/config.json"
  script:
    - >
      /kaniko/executor
      --context "${CI_PROJECT_DIR}/ozon-app-web"
      --dockerfile "${CI_PROJECT_DIR}/ozon-app-web/Dockerfile"
      --destination "${REGISTRY_HOST}/${IMAGE_REF}:${CI_COMMIT_SHORT_SHA}"
      --destination "${REGISTRY_HOST}/${IMAGE_REF}:latest"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "1.0"'
