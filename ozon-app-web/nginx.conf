server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 100M;

    # Security headers (A-06)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Keycloak OAuth2 callback — must match redirect_uri registered in Keycloak
    location /auth/ {
        proxy_pass __BACKEND_UPSTREAM__/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Proxy /api/* → backend (strips /api prefix)
    location /api/ {
        proxy_pass __BACKEND_UPSTREAM__/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A-05 (confermato dal backend, BE-4): l'unico header di identità fidato è
        # KEYCLOAK_REMOTE_USER_HEADER (x-remote-user di default). Azzerare l'intera
        # famiglia di header oauth2-proxy/forwarded-auth che un client potrebbe
        # fabbricare per impersonare un utente, poi iniettare solo quello configurato.
        proxy_set_header X-Remote-Email "";
        proxy_set_header X-Remote-Groups "";
        proxy_set_header X-Forwarded-User "";
        proxy_set_header X-Forwarded-Email "";
        proxy_set_header X-Forwarded-Groups "";
        proxy_set_header X-Forwarded-Preferred-Username "";
        proxy_set_header X-Auth-Request-User "";
        proxy_set_header X-Auth-Request-Email "";
        proxy_set_header X-Auth-Request-Groups "";
        proxy_set_header X-Auth-Request-Preferred-Username "";
        proxy_set_header x-remote-user $http_x_remote_user;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    # Login/logout/refresh endpoints used by the Angular runtime config
    location = /login {
        proxy_pass __BACKEND_UPSTREAM__/login;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location = /logout {
        proxy_pass __BACKEND_UPSTREAM__/logout;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location = /refresh {
        proxy_pass __BACKEND_UPSTREAM__/refresh;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
}
