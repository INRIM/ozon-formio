server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 100M;

    # Security headers (A-06)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Keycloak OAuth2 callback — must match redirect_uri registered in Keycloak
    location /auth/ {
        proxy_pass __BACKEND_UPSTREAM__/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Proxy /api/* → backend (strips /api prefix)
    location /api/ {
        proxy_pass __BACKEND_UPSTREAM__/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # x-remote-user: passthrough intenzionalmente NON rimosso qui.
        # Verificato (A-05, docAnalisi/SECURITY_ANALISI_AZIONI_FRONTEND.it.md) che
        # il frontend non imposta mai un header Authorization: quel passthrough
        # inoltrava solo un header fabbricato dal client, rimosso.
        # x-remote-user resta finché il backend non conferma se lo tratta come
        # identità fidata (BE-4) — azzerarlo alla cieca puo' rompere un flusso
        # oauth2-proxy legittimo.
        proxy_set_header x-remote-user $http_x_remote_user;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    # Login/logout/refresh endpoints used by the Angular runtime config
    location = /login {
        proxy_pass __BACKEND_UPSTREAM__/login;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location = /logout {
        proxy_pass __BACKEND_UPSTREAM__/logout;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location = /refresh {
        proxy_pass __BACKEND_UPSTREAM__/refresh;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
}
