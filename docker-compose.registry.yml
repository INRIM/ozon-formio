services:
  ozon-app-web:
    image: ${OZON_APP_WEB_IMAGE:-registry.w.ininrim.it/inrimsi/microservice/services-apps/ozon-formio:latest}
    platform: linux/amd64
    pull_policy: always
    env_file:
      - ./.env
    environment:
      BACKEND_UPSTREAM: ${BACKEND_UPSTREAM:-http://ozon-env-app:8000}
    ports:
      - "${OZON_ANGULAR_PORT:-4200}:80"
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://localhost/ || exit 1
      interval: 15s
      timeout: 8s
      retries: 6
      start_period: 20s

networks:
  backend:
    external: true
    name: ${BACKEND_DOCKER_NETWORK:-ozon-network}
