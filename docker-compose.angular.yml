services:
  ozon-app-web:
    build:
      context: ./ozon-app-web
      dockerfile: Dockerfile
    image: ozon-app-web:local
    env_file:
      - ./.env
    environment:
      BACKEND_UPSTREAM: ${BACKEND_UPSTREAM:-http://ozon-env-app:8000}
    ports:
      - "${OZON_ANGULAR_PORT:-4200}:80"
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://localhost:80/ || exit 1
      interval: 15s
      timeout: 8s
      retries: 6
      start_period: 20s



networks:
  backend:
    external: true
    name: ${BACKEND_DOCKER_NETWORK:-ozon-network}
